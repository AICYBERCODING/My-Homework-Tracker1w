<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src="about:blank"></iframe>
    <script>
        window.onload = function() {
            // IMPORTANT: Replace the URL below with your own Web App URL
            var gasAppUrl = 'PASTE_YOUR_WEB_APP_URL_HERE';
            document.getElementById('app-frame').src = gasAppUrl + window.location.search;
        };
    </script>
</body>
</html>
